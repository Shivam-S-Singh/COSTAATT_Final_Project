services:
    bind9:
        container_name: bind9
        restart: always
        ports:
            - 53:53/udp
            - 53:53/tcp
            - 127.0.0.1:953:953/tcp
        volumes:
            - ./config:/etc/bind
            - ./cache:/var/cache/bind
            - ./records:/var/lib/bind
            - /var/log
        image: internetsystemsconsortium/bind9:9.18
        environment:
            - BIND9_USER=root
            - TZ=America/Port_of_Spain
        networks:
          network_services:
            ipv4_address: 172.16.10.30
networks:
  network_services:
    external: true